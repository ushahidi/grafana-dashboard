version: "3.9"

services:
  grafana:
    build: .
    container_name: grafana-ush
    ports:
      - "3000:3000"
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=yesoreyeram-boomtheme-panel,yesoreyeram-infinity-datasource,marcusolsson-dynamictext-panel
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=max-progressbars-panel,ushahidi-platformbreakdown-panel
    volumes:
      - ./data/plugins/max-progressbars-panel:/var/lib/grafana/plugins/max-progressbars-panel
      - ./data/plugins/ushahidi-platformbreakdown-panel:/var/lib/grafana/plugins/ushahidi-platformbreakdown-panel
      - ./conf/custom.ini:/etc/grafana/grafana.ini
      - ./conf/provisioning:/etc/grafana/provisioning
      - ./data:/var/lib/grafana
      - ./public/img/custom:/usr/share/grafana/public/img/custom
    restart: unless-stopped
